# Dev override: bind-mount source + hot reload.
#
# NOT auto-loaded — pass it explicitly, alongside the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# It used to be named docker-compose.override.yml, which Compose loads automatically on
# a bare `docker compose up`. On the production host that was a live footgun: one
# accidental bare command would have run production with source bind mounts, dev watch
# mode and debug logging. The name now matches the base-overlay convention used by
# docker-compose.prod.yml, so nothing loads by accident in either direction.
services:
  backend:
    build:
      dockerfile: backend/Dockerfile.api
      target: build
    # The image's WORKDIR is /app/backend (both Dockerfiles), so npm runs from the
    # backend package directly — `npm --prefix backend …` resolves to the non-existent
    # /app/backend/backend/package.json and the container crash-loops with ENOENT.
    command: sh -c "npx prisma migrate deploy --schema=../database/prisma/schema.prisma && npm run dev"
    volumes:
      - ./backend/src:/app/backend/src
      # Unlike src, tests were NOT mounted, so the suite always ran the copy baked
      # into the image at build time — a test added or edited in the working tree
      # was invisible to `npx jest` (it just reported "No tests found"). Mounted so
      # the guard tests actually track the checkout.
      - ./backend/tests:/app/backend/tests
      - ./database:/app/database
    environment:
      LOG_LEVEL: debug

  worker:
    build:
      dockerfile: backend/Dockerfile.worker
      target: build
    command: npm run dev:worker
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/tests:/app/backend/tests
      - ./database:/app/database

  frontend:
    # !reset removes the base `build:` so this service NEVER rebuilds/retags node:20-alpine.
    build: !reset null
    image: node:20-alpine
    # The base file caps the frontend at 192m for the static nginx image. This dev service
    # is a Vite dev server instead — esbuild workers + HMR need real headroom, and without
    # this the container gets OOM-killed under load (SIGKILL / esbuild EPIPE crash-loop).
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4001/api/v1}
      # Vite's HMR client must dial the port the BROWSER sees — the published host
      # port (FRONTEND_PORT), not the container-internal 5173. See frontend/vite.config.ts.
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5173}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      # Published port is a variable so this dev stack can sit next to the production
      # stack (frontend 5173) instead of fighting it for the port.
      #
      # !override is required, not decoration: Compose *concatenates* ports lists across
      # files, so without it the base file's `5173:80` (added for the static nginx image)
      # is kept alongside this mapping. That leaves the dev stack trying to bind 5173 —
      # the production frontend's port — and `up` dies with
      # "Bind for 0.0.0.0:5173 failed: port is already allocated".
      - "${FRONTEND_PORT:-5173}:5173"
    # The base file probes port 80 for the static nginx image. This service is a Vite dev
    # server on 5173, so the inherited check would report "unhealthy" for its whole life.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # `npm install` runs on container start, so give it room on a cold start.
      start_period: 120s
