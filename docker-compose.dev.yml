# Dev override: bind-mount source + hot reload.
#
# NOT auto-loaded — pass it explicitly, alongside the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# It used to be named docker-compose.override.yml, which Compose loads automatically on
# a bare `docker compose up`. On the production host that was a live footgun: one
# accidental bare command would have run production with source bind mounts, dev watch
# mode and debug logging. The name now matches the base-overlay convention used by
# docker-compose.prod.yml, so nothing loads by accident in either direction.
services:
  backend:
    build:
      dockerfile: backend/Dockerfile.api
      target: build
    command: sh -c "npx prisma migrate deploy --schema=../database/prisma/schema.prisma && npm --prefix backend run dev"
    volumes:
      - ./backend/src:/app/backend/src
      - ./database:/app/database
    environment:
      LOG_LEVEL: debug

  worker:
    build:
      dockerfile: backend/Dockerfile.worker
      target: build
    command: npm --prefix backend run dev:worker
    volumes:
      - ./backend/src:/app/backend/src
      - ./database:/app/database

  frontend:
    # !reset removes the base `build:` so this service NEVER rebuilds/retags node:20-alpine.
    build: !reset null
    image: node:20-alpine
    # The base file caps the frontend at 192m for the static nginx image. This dev service
    # is a Vite dev server instead — esbuild workers + HMR need real headroom, and without
    # this the container gets OOM-killed under load (SIGKILL / esbuild EPIPE crash-loop).
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4001/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
