# Base topology — the shape a bare `docker compose up` runs.
#
# Dev overlay  : docker-compose.dev.yml   (bind mounts + hot reload — pass with -f, NOT auto-loaded)
# Prod overlay : docker-compose.prod.yml  (loopback-only datastores, bind-mounted state, port vars)
#
# Resource limits: every service is capped with `mem_limit` + `cpus` because this host is a
# shared 4 vCPU / 8 GB box running three production stacks. These are ceilings, not
# reservations — idle services use far less. The worker gets the largest share because it
# runs real Chromium instances (SCRAPER_CONCURRENCY browsers at once); the API's Node heap
# is capped via NODE_OPTIONS so the GC reclaims memory before the container limit is hit
# and the kernel OOM-killer steps in. Watch for OOM kills in `docker inspect <ctr>
# --format '{{.State.OOMKilled}}'` and raise a limit only with evidence.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    # Drop every capability and add back only what the image entrypoint needs to chown
    # PGDATA and drop privileges to the postgres user on first boot.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psx_password}
      POSTGRES_DB: ${POSTGRES_DB:-psx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psx} -d ${POSTGRES_DB:-psx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    cap_drop:
      - ALL
    # The redis entrypoint chowns /data to the `redis` user then drops privileges via
    # su-exec; it needs the same ownership/uid-switch caps as postgres, else it can't
    # traverse /data/appendonlydir on startup ("Permission denied").
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT:-4000}
      # Keep the V8 heap well under the 512m container limit so GC runs before the
      # limit is reached (same pattern as the worker).
      NODE_OPTIONS: "--max-old-space-size=384"
    # No `command:` override — the image's own entrypoint (docker-entrypoint-api.sh)
    # runs migrations then starts the server. Keeps this compose file portable to any host.
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health answers 200 only when Postgres *and* Redis respond, so `docker compose ps`
    # reports "unhealthy" rather than a cheerful "Up" for a process that is running but
    # cannot serve a request. start_period covers the migrations the entrypoint applies
    # before the server binds. Anything health-gated on this service waits for it.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    # Largest cap: this process owns the Puppeteer browser pool, so Chromium's memory
    # lives inside this limit alongside the Node heap.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: "2.0"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_OPTIONS: "--max-old-space-size=1024"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # Liveness probe: the worker exposes no port, so this checks it can still reach its
    # critical dependency (Redis) over the compose network. It won't detect a hung job,
    # but `restart: unless-stopped` already recovers crashes — this surfaces the
    # "worker is up but cut off from Redis" case that would otherwise look healthy.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const s=net.connect(6379,'redis',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # SAME-ORIGIN path by default (see frontend/nginx.conf): the frontend container
        # proxies /api/ to the `backend` service, so one image works on
        # http://<host>:5100 and on any domain routed here. An absolute URL at this
        # point pins the bundle to one origin and breaks it everywhere else.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    # Static nginx — light. The dev overlay raises these caps, because the dev frontend is
    # a Vite dev server (esbuild + HMR) rather than a static file server.
    mem_limit: 192m
    mem_reservation: 96m
    cpus: "0.5"
    # nginx master runs as root (Config.User is empty in the image) and drops to the
    # `nginx` user for workers; keep SETUID/SETGID so that drop still works with all
    # other capabilities removed.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      # Host port comes from FRONTEND_PORT so the public entry point is a .env value, not a
      # compose constant — the production overlay sets the same mapping.
      - "${FRONTEND_PORT:-5100}:80"
    depends_on:
      - backend
    # busybox wget ships in nginx:alpine — verified inside the running container.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
