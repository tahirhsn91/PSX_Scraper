<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pakistan Stock Exchange prices, indices and sync status." />

    <!-- Social share (Open Graph + Twitter card).
         These MUST be static and MUST use absolute URLs. The crawlers that build a link preview —
         WhatsApp, Facebook, X, LinkedIn, Slack, Discord — fetch the HTML and do NOT execute
         JavaScript, so anything a React effect writes after mount is invisible to them. A relative
         `og:image` is silently ignored and the card renders with no thumbnail at all.
         `usePageMeta` mirrors the per-route title over these for crawlers that do run JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Portfolio 365" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:url" content="https://psx.myportfolio365.com/" />
    <meta property="og:title" content="My Portfolio 365 Market — live PSX prices and indices" />
    <meta
      property="og:description"
      content="Live Pakistan Stock Exchange prices, KSE-100 and sector indices, dividend history and portfolio tracking. Updated as the market moves."
    />
    <meta property="og:image" content="https://psx.myportfolio365.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The My Portfolio 365 stock page for ENGROH, showing a one-year price line chart."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Portfolio 365 Market — live PSX prices and indices" />
    <meta
      name="twitter:description"
      content="Live Pakistan Stock Exchange prices, KSE-100 and sector indices, dividend history and portfolio tracking. Updated as the market moves."
    />
    <meta name="twitter:image" content="https://psx.myportfolio365.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The My Portfolio 365 stock page for ENGROH, showing a one-year price line chart."
    />
    <meta name="theme-color" content="#3F4140" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3A3F3D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#3F4140" />
    <!-- The brand mark. The tab icon and the header logo are the same artwork on purpose: the old
         hand-drawn SVG chart was a second, drifting identity for the same product.
         A 32px file is what the tab needs — pointing the icon at the 512px master made every page
         load fetch 147 KB for it. `logo.png` stays in `public/` as the master to derive new sizes
         from, and is referenced by nothing at runtime. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts, self-hosted.
         These came from fonts.googleapis.com as a render-blocking `rel="stylesheet"`, which put a
         cross-origin request chain (googleapis.com for the CSS, then gstatic.com for the file) on the
         critical path ahead of first paint. They are now served from our own origin, so there is no
         third-party round trip before the text can render.

         One file per subset is enough because Plus Jakarta Sans is a **variable** font (`wght`
         200–800): five weights are five instances of the same file, not five downloads. Declaring the
         range is what makes 600/700/800 render as themselves — five `@font-face` rules all pointing
         at one variable file with a single weight each would render every one of them at the default
         instance.

         Two subsets only: the app is read in latin script and the cyrillic, greek and vietnamese
         subsets Google also serves cannot render a PSX company name. `unicode-range` preserves the
         subsetting, so a visitor still downloads only the file their text needs. Licence: OFL-1.1,
         text in `public/fonts/OFL.txt`. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      crossorigin
    />
    <style>
      /* `crossorigin` above is not optional: fonts are always fetched in CORS mode, so a preload
         without it is a second, wasted request. Weight 400 is the one preloaded because it is the
         body text — and the largest contentful element on the dashboard is a paragraph of it. */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <title>My Portfolio 365 Market</title>
    <!-- Google tag (gtag.js).
         The stub is defined now so early calls queue; only the 180 KB library is deferred. Measured,
         gtag.js cost 0.7–1.5s of main-thread work on every page with long tasks of 388–684ms, while
         competing with the bundle that was still blocking first paint — which is exactly the window
         Core Web Vitals are scored in.

         Loading it on `load` keeps the critical path ours and loses nothing: gtag is built to queue
         commands in `dataLayer` until the library arrives, and this app never calls gtag itself
         (`gtag` appears nowhere in `src/`), so there is no route-change tracking to break and the
         only change is that one pageview fires a second or two later. The measurement ID is
         unchanged. `requestIdleCallback` avoids interrupting a busy main thread; its timeout is the
         backstop for a background tab, where idle callbacks may not fire at all. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-RHD6X5DCJ8');

      (function () {
        function load() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-RHD6X5DCJ8';
          document.head.appendChild(s);
        }
        window.addEventListener(
          'load',
          function () {
            if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
            else setTimeout(load, 200);
          },
          { once: true }
        );
      })();
    </script>
    <script>
      // Resolve the theme before first paint: without this the page flashes light-mode surfaces
      // before React mounts. Mirrors the logic in src/providers/ColorModeContext.tsx.
      (function () {
        try {
          // Light is the default: the OS preference is only followed once the user has explicitly
          // chosen "system".
          var stored = localStorage.getItem('color-mode');
          var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var mode = stored === 'dark' || (stored === 'system' && prefersDark) ? 'dark' : 'light';
          // The navigation bar is the topmost surface, so it is the colour the browser paints
          // around the page. These two values mirror nav.bg in src/theme/tokens.ts — they cannot be
          // imported here, because this runs before the bundle loads.
          var chrome = mode === 'dark' ? '#3A3F3D' : '#3F4140';
          var root = document.documentElement;
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
          root.style.backgroundColor = mode === 'dark' ? '#161817' : '#F1F1F1';
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (meta) meta.setAttribute('content', chrome);
        } catch (e) {
          /* storage blocked: fall back to the media-based theme-color metas */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
