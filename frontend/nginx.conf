# =============================================================================
# PSX Stock Scraper — frontend container: static SPA + same-origin API proxy.
#
# WHY THE /api/ PROXY LIVES HERE
#   `VITE_API_URL` is baked into the JS bundle at image build time, so an absolute
#   value (http://<host>:4000/api/v1) only ever works for the one origin it names.
#   Loaded from a domain — or over https — the browser refuses those calls and the
#   UI shows "Failed to load the stock list." with no request ever reaching the API:
#
#     1. mixed content   — an https page may not XHR an http:// URL at all;
#     2. CORS            — the API's CORS_ORIGIN must contain the *page's* origin,
#                          and a new domain is never in that list;
#     3. no /api route   — this server is static, so /api/... falls through to
#                          index.html and the client gets HTML where it wanted JSON.
#
#   Serving the API from the same origin the page came from removes all three, and
#   makes the image domain-agnostic: identical behaviour on http://<host>:5100,
#   https://myportfolio365.com and https://psx.myportfolio365.com. It also means the
#   bundle carries no host-specific URL, so pointing a new domain at this container
#   needs no rebuild.
#
#   `backend` is the compose service name, resolved on the compose network — this
#   never depends on the host's published port.
# =============================================================================

# `map` is valid in the http context, which is where conf.d/*.conf is included, so
# these may live beside the server block that uses them.
#
# Only send `Connection: upgrade` when the client actually asked to upgrade. A
# hardcoded "upgrade" on every request (including plain HTTP ones) confuses
# upstreams that don't speak WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Preserve the scheme the *client* used. The host nginx sets X-Forwarded-Proto;
# this container can also be reached directly (http://<host>:5100), where nothing
# sets it — fall back to this connection's own scheme instead of forwarding an
# empty header.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# =============================================================================
# COMPRESSION
#
# Without a `gzip_types` line nginx falls back to its built-in default, which is
# `text/html` and nothing else. That is exactly what was happening: HTML arrived
# gzipped while every JavaScript and CSS file went out raw. The entry chunk alone
# is 589,072 bytes uncompressed and 189,460 bytes gzipped — on a 1.6 Mbit/s
# connection that is the difference between 5.6s and 1.9s before the app can even
# start executing, and it is 66% of all JS bytes across the build.
#
#   `gzip_vary` — responses now depend on Accept-Encoding, so any cache in front
#   of this must key on it or it will hand a gzipped body to a client that did
#   not ask for one.
#   `gzip_proxied any` — this container normally sits behind the host's nginx, and
#   the default (`off`) would switch compression off for anything arriving with a
#   proxy marker. Safe here precisely because gzip_vary is on.
#   `gzip_min_length` — below a few hundred bytes the overhead can exceed the win.
#
# `text/html` needs no mention: nginx always compresses it when gzip is on.
# =============================================================================
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # ── API passthrough ─────────────────────────────────────────────────────────
  # A prefix location, so it is matched BEFORE `location /` — otherwise the SPA
  # fallback below answers /api/... with index.html (HTTP 200 + text/html) and the
  # client reports a JSON parse error instead of a real status code.
  location /api/ {
    # Docker's embedded DNS. nginx resolves an upstream name ONCE, at startup: with a
    # literal `proxy_pass http://backend:4000`, recreating the backend container (which
    # is exactly what a deploy does) leaves this vhost pointing at the old IP and
    # 502-ing until it is restarted. Resolving through a variable re-looks-up per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:4000;

    # No URI part → the original path is forwarded unchanged, so /api/v1/stocks stays
    # /api/v1/stocks (that prefix is what the API serves).
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    # Forward the client chain. express-rate-limit derives the client IP from
    # X-Forwarded-For via req.ip, and it *throws* ERR_ERL_UNEXPECTED_X_FORWARDED_FOR
    # when the header arrives while Express's `trust proxy` is off — so the API's
    # TRUST_PROXY must count every proxy in front of it (the host nginx AND this one).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Live sync status is polled and long scrapes stream results back.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
  }

  # ── Static assets vs the HTML shell ─────────────────────────────────────────
  # Vite content-hashes every chunk (`index-C0nnXtxa.js`), so a given filename's bytes can never
  # change and these may be cached for as long as the browser will keep them. Without this they
  # carried only ETag/Last-Modified — a conditional round trip for all 26 chunks on every single page
  # load, before the app could trust its own cache.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # The HTML is the exact opposite and must never be cached long: it is the file that names the
  # current chunk hashes, so a stale copy points at files that no longer exist and the app fails to
  # boot after a deploy. `no-cache` still permits *storing* it — it only requires revalidation, which
  # is precisely what a shell file needs. The SPA fallback in `location /` is an internal redirect,
  # so it re-matches and lands here too.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # `webmanifest` is absent from this image's mime.types, so the manifest was served as
  # application/octet-stream and browsers ignored it. A location-scoped `types` block replaces the
  # inherited map for this path only.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
